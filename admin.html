<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Raft & Draft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;}
.site{font-family:'Inter',sans-serif;color:#111;max-width:680px;margin:0 auto;background:#fff;padding:0 20px;}
@media(min-width:720px){.site{padding:0;}}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#111;width:100%;}
.nav-logo img{height:90px;width:auto;display:block;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-size:12px;font-weight:400;color:#ccc;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;}
.nav-links a:hover{color:#fff;}
.admin-wrap{padding:32px 0;}
.admin-title{font-family:'EB Garamond',serif;font-size:28px;font-weight:700;margin-bottom:24px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#777;margin-bottom:6px;display:block;}
.form-group input,
.form-group select,
.form-group textarea{width:100%;border:.5px solid #ddd;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;color:#111;outline:none;background:#fff;}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:#111;}
.form-group textarea{resize:vertical;}
.form-group textarea.tall{height:320px;}
.form-group textarea.short{height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.submit-btn{background:#111;color:#fff;border:none;padding:12px 32px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:20px;}
.submit-btn:hover{background:#333;}
.msg{font-size:13px;margin-top:12px;color:#2D3561;}
#login-screen{padding:80px 0;text-align:center;}
#login-screen input{border:.5px solid #ddd;padding:10px 16px;font-size:14px;margin-bottom:12px;width:240px;display:block;margin:0 auto 12px;outline:none;}
#login-screen input:focus{border-color:#111;}
.footer{padding:20px 0;border-top:1px solid #ddd;margin-top:32px;text-align:center;}
.footer-copy{font-size:11px;color:#999;letter-spacing:.04em;}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<nav>
  <div class="nav-logo"><a href="index.html"><img src="logo.jpg" alt="Raft & Draft" /></a></div>
  <div class="nav-links">
    <a href="library.html">Библиотека</a>
    <a href="guidelines.html">Гайдлайны</a>
    <a href="about.html">О журнале</a>
  </div>
</nav>
<div class="site">
  <div id="login-screen">
    <div style="font-family:'EB Garamond',serif;font-size:22px;margin-bottom:20px;">Вход в админку</div>
    <input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkPwd()" />
    <br>
    <button class="submit-btn" onclick="checkPwd()">Войти</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="admin-panel" style="display:none;">
    <div class="admin-wrap">
      <div class="admin-title">Добавить работу</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Название</label><input id="f-title" placeholder="Терпение" /></div>
        <div class="form-group"><label class="form-label">Автор</label><input id="f-author" placeholder="Анна Северова" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Страна</label><input id="f-city" placeholder="Россия" /></div>
        <div class="form-group"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Тип</label>
          <select id="f-type"><option>Проза</option><option>Поэзия</option><option>Сценарий</option><option>Пьеса</option><option>Статья</option><option>Эссе</option></select>
        </div>
        <div class="form-group"><label class="form-label">Жанр</label>
          <input id="f-genre" placeholder="Драма, хоррор, магреализм..." />
        </div>
      </div>
      <div class="form-group"><label class="form-label">Описание работы</label><textarea id="f-description" class="short" placeholder="2–3 предложения о чём работа"></textarea></div>
      <div class="form-group"><label class="form-label">Слова автора</label><textarea id="f-author-note" class="short" placeholder="Примечание или цитата от автора (необязательно)"></textarea></div>
      <div class="form-group"><label class="form-label">Текст работы</label><textarea id="f-content" class="tall" placeholder="Вставьте текст работы..."></textarea></div>
      <button class="submit-btn" onclick="publish()">Опубликовать</button>
      <div class="msg" id="pub-msg"></div>
    </div>
  </div>

  <div class="footer"><div class="footer-copy">© 2026 Raft & Draft. Все права защищены.</div></div>
</div>
<script>
const SUPABASE_URL = 'https://jklglpxcspykidibuyra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_q2fsDKFZ_RATNkQ96JuqlQ_XWQTIv0g';
const ADMIN_PASSWORD = 'rafdraft2026';

function checkPwd() {
  const pwd = document.getElementById('pwd').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
  } else {
    document.getElementById('login-msg').textContent = 'Неверный пароль.';
  }
}

async function publish() {
  const title = document.getElementById('f-title').value.trim();
  const author = document.getElementById('f-author').value.trim();
  const content = document.getElementById('f-content').value.trim();
  if (!title || !author || !content) { document.getElementById('pub-msg').textContent = 'Заполните название, автора и текст.'; return; }
  const body = {
    title, author,
    city: document.getElementById('f-city').value.trim() || null,
    type: document.getElementById('f-type').value,
    genre: document.getElementById('f-genre').value,
    description: document.getElementById('f-description').value.trim() || null,
    author_note: document.getElementById('f-author-note').value.trim() || null,
    content, likes: 0
  };
  const res = await fetch(SUPABASE_URL + '/rest/v1/works', {
    method: 'POST',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
    body: JSON.stringify(body)
  });
  if (res.ok) {
    document.getElementById('pub-msg').textContent = 'Опубликовано!';
    ['f-title','f-author','f-city','f-content','f-description','f-author-note'].forEach(id => document.getElementById(id).value = '');
  } else {
    const err = await res.text();
    document.getElementById('pub-msg').textContent = 'Ошибка: ' + err;
  }
}
</script>
</body>
</html>
