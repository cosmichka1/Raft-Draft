<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Raft & Draft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;}
.site{font-family:'Inter',sans-serif;color:#111;max-width:680px;margin:0 auto;background:#fff;padding:0 20px;}
@media(min-width:720px){.site{padding:0;}}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#111;width:100%;}
.nav-logo img{height:90px;width:auto;display:block;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-size:12px;font-weight:400;color:#ccc;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;}
.nav-links a:hover{color:#fff;}
.admin-wrap{padding:32px 0;}
.admin-title{font-family:'EB Garamond',serif;font-size:28px;font-weight:700;margin-bottom:24px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#777;margin-bottom:6px;display:block;}
.form-group input,
.form-group select,
.form-group textarea{width:100%;border:.5px solid #ddd;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;color:#111;outline:none;background:#fff;}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:#111;}
.form-group textarea{resize:vertical;}
.form-group textarea.tall{height:320px;}
.form-group textarea.short{height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.submit-btn{background:#111;color:#fff;border:none;padding:12px 32px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:20px;}
.submit-btn:hover{background:#333;}
.msg{font-size:13px;margin-top:12px;color:#2D3561;}
#login-screen{padding:80px 0;text-align:center;}
#login-screen input{border:.5px solid #ddd;padding:10px 16px;font-size:14px;margin-bottom:12px;width:240px;display:block;margin:0 auto 12px;outline:none;}
#login-screen input:focus{border-color:#111;}
.footer{padding:20px 0;border-top:1px solid #ddd;margin-top:32px;text-align:center;}
.footer-copy{font-size:11px;color:#999;letter-spacing:.04em;}
.divider{height:1px;background:#ddd;margin:40px 0 24px;}
.delete-search{margin-bottom:16px;}
.delete-list{display:flex;flex-direction:column;gap:1px;background:#eee;border:.5px solid #eee;}
.delete-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:12px 14px;}
.delete-row-info{min-width:0;}
.delete-row-title{font-family:'EB Garamond',serif;font-size:15px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.delete-row-meta{font-size:11px;color:#999;margin-top:2px;}
.delete-btn{flex-shrink:0;font-size:11px;color:#b33;border:.5px solid #e0b3b3;background:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;}
.delete-btn:hover{background:#b33;color:#fff;border-color:#b33;}
.delete-btn.confirming{background:#b33;color:#fff;border-color:#b33;}
.delete-empty{font-size:13px;color:#aaa;padding:16px 0;}
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<nav>
<div class="nav-logo"><a href="index.html"><img src="logo.jpg" alt="Raft & Draft" /></a></div>
<div class="nav-links">
<a href="library.html">Библиотека</a>
<a href="guidelines.html">Гайдлайны</a>
<a href="about.html">О журнале</a>
</div>
</nav>
<div class="site">
<div id="login-screen">
<div style="font-family:'EB Garamond',serif;font-size:22px;margin-bottom:20px;">Вход в админку</div>
<input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkPwd()" />
<br>
<button class="submit-btn" onclick="checkPwd()">Войти</button>
<div class="msg" id="login-msg"></div>
</div>
<div id="admin-panel" style="display:none;">
<div class="admin-wrap">
<div class="admin-title">Добавить работу</div>
<div class="form-group"><label class="form-label">Название</label><input id="f-title" placeholder="Терпение" /></div>
<div class="form-row">
<div class="form-group"><label class="form-label">Автор</label><input id="f-author" placeholder="Анна Северова" oninput="rdAutoAuthorEn()" /></div>
<div class="form-group"><label class="form-label">Автор латиницей (для EN)</label><input id="f-author-en" placeholder="Anna Severova" oninput="this.dataset.touched='1'" /></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">Страна</label><select id="f-city"></select></div>
<div class="form-group"><label class="form-label">Дата публикации</label><input type="date" id="f-date" /></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">Тип</label>
<select id="f-type"><option>Проза</option><option>Поэзия</option><option>Сценарий</option><option>Пьеса</option><option>Статья</option><option>Эссе</option></select>
</div>
<div class="form-group"><label class="form-label">Жанр</label>
<select id="f-genre"></select>
</div>
</div>
<div class="form-group"><label class="form-label">Описание работы (по-русски)</label><textarea id="f-description" class="short" placeholder="2–3 предложения о чём работа"></textarea></div>
<div class="form-group"><label class="form-label">Описание работы (по-английски)</label><textarea id="f-description-en" class="short" placeholder="The same 2–3 sentences in English"></textarea></div>
<div class="form-group"><label class="form-label">Слова автора</label><textarea id="f-author-note" class="short" placeholder="Примечание или цитата от автора (необязательно)"></textarea></div>
<div class="form-group"><label class="form-label">Текст работы</label><textarea id="f-content" class="tall" placeholder="Вставьте текст работы..."></textarea></div>
<button class="submit-btn" onclick="publish()">Опубликовать</button>
<div class="msg" id="pub-msg"></div>
<div class="divider"></div>
<div class="admin-title">Удалить работу</div>
<div class="form-group delete-search">
<input id="delete-search" placeholder="Поиск по названию или автору..." oninput="renderDeleteList()" />
</div>
<div class="delete-list" id="delete-list"></div>
<div class="msg" id="delete-msg"></div>
</div>
</div>
<div class="footer"><div class="footer-copy">© 2026 Raft & Draft. Все права защищены.</div></div>
</div>
<script>
const SUPABASE_URL = 'https://jklglpxcspykidibuyra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_q2fsDKFZ_RATNkQ96JuqlQ_XWQTIv0g';
const ADMIN_PASSWORD = 'rafdraft2026';
let allWorksForDelete = [];
let confirmingId = null;

// Fill the country and genre lists from the journal's fixed lists in i18n.js.
function rdFillSelect(id, list, emptyLabel) {
const sel = document.getElementById(id);
sel.innerHTML = '<option value="">' + emptyLabel + '</option>' +
list.map((item, i) => '<option value="' + i + '">' + item[0] + ' / ' + item[1] + '</option>').join('');
}
rdFillSelect('f-city', RD_COUNTRY_LIST, 'Не указана');
rdFillSelect('f-genre', RD_GENRE_LIST, 'Без жанра');

// Latin spelling of the author's name fills in by itself until you edit it by hand.
function rdAutoAuthorEn() {
const en = document.getElementById('f-author-en');
if (en.dataset.touched === '1') return;
en.value = rdTranslit(document.getElementById('f-author').value);
}

function rdTodayLocal() {
const d = new Date();
d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
return d.toISOString().slice(0, 10);
}

function rdWorkDate(w) {
return new Date(String(w.published_at || w.created_at).slice(0, 10) + 'T00:00:00');
}

function checkPwd() {
const pwd = document.getElementById('pwd').value;
if (pwd === ADMIN_PASSWORD) {
document.getElementById('login-screen').style.display = 'none';
document.getElementById('admin-panel').style.display = 'block';
document.getElementById('f-date').value = rdTodayLocal();
loadWorksForDelete();
} else {
document.getElementById('login-msg').textContent = 'Неверный пароль.';
}
}

async function publish() {
const title = document.getElementById('f-title').value.trim();
const author = document.getElementById('f-author').value.trim();
const content = document.getElementById('f-content').value.trim();
if (!title || !author || !content) { document.getElementById('pub-msg').textContent = 'Заполните название, автора и текст.'; return; }
const cityIdx = document.getElementById('f-city').value;
const genreIdx = document.getElementById('f-genre').value;
const country = cityIdx === '' ? null : RD_COUNTRY_LIST[+cityIdx];
const genre = genreIdx === '' ? null : RD_GENRE_LIST[+genreIdx];
const body = {
title, author,
author_en: document.getElementById('f-author-en').value.trim() || rdTranslit(author),
city: country ? country[0] : null,
city_en: country ? country[1] : null,
type: document.getElementById('f-type').value,
genre: genre ? genre[0] : null,
genre_en: genre ? genre[1] : null,
description: document.getElementById('f-description').value.trim() || null,
description_en: document.getElementById('f-description-en').value.trim() || null,
author_note: document.getElementById('f-author-note').value.trim() || null,
published_at: document.getElementById('f-date').value || rdTodayLocal(),
content, likes: 0
};
const res = await fetch(SUPABASE_URL + '/rest/v1/works', {
method: 'POST',
headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
body: JSON.stringify(body)
});
if (res.ok) {
document.getElementById('pub-msg').textContent = 'Опубликовано!';
['f-title','f-author','f-content','f-description','f-author-note','f-author-en','f-description-en'].forEach(id => document.getElementById(id).value = '');
document.getElementById('f-author-en').dataset.touched = '';
document.getElementById('f-city').value = '';
document.getElementById('f-genre').value = '';
loadWorksForDelete();
} else {
const err = await res.text();
document.getElementById('pub-msg').textContent = 'Ошибка: ' + err;
}
}

async function loadWorksForDelete() {
const res = await fetch(SUPABASE_URL + '/rest/v1/works?order=published_at.desc.nullslast,created_at.desc&select=id,title,author,type,created_at,published_at', {
headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
});
allWorksForDelete = await res.json();
confirmingId = null;
renderDeleteList();
}

function renderDeleteList() {
const q = document.getElementById('delete-search').value.trim().toLowerCase();
const list = document.getElementById('delete-list');
const filtered = allWorksForDelete.filter(w =>
!q || w.title.toLowerCase().includes(q) || w.author.toLowerCase().includes(q)
);
if (!filtered.length) {
list.innerHTML = '<div class="delete-empty">Работ не найдено.</div>';
return;
}
list.innerHTML = filtered.map(w => `
<div class="delete-row">
<div class="delete-row-info">
<div class="delete-row-title">${w.title}</div>
<div class="delete-row-meta">${w.author} · ${w.type} · ${rdWorkDate(w).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</div>
</div>
<button class="delete-btn ${confirmingId === w.id ? 'confirming' : ''}" onclick="handleDeleteClick('${w.id}')">
${confirmingId === w.id ? 'Точно удалить?' : 'Удалить'}
</button>
</div>
`).join('');
}

function handleDeleteClick(id) {
if (confirmingId !== id) {
confirmingId = id;
renderDeleteList();
return;
}
deleteWork(id);
}

async function deleteWork(id) {
const res = await fetch(SUPABASE_URL + '/rest/v1/works?id=eq.' + id, {
method: 'DELETE',
headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=minimal'}
});
if (res.ok) {
document.getElementById('delete-msg').textContent = 'Удалено.';
loadWorksForDelete();
} else {
const err = await res.text();
document.getElementById('delete-msg').textContent = 'Ошибка: ' + err;
}
}
</script>
</body>
</html>
