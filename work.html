<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raft & Draft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;}
.site{font-family:'Inter',sans-serif;color:#111;max-width:680px;margin:0 auto;background:#fff;padding:0 20px;}
@media(min-width:720px){.site{padding:0;}}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#111;width:100%;}
.nav-logo img{height:90px;width:auto;display:block;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-size:12px;font-weight:400;color:#ccc;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;}
.nav-links a:hover{color:#fff;}
.nav-submit{background:#fff;color:#111!important;padding:6px 14px;font-size:11px!important;letter-spacing:.06em!important;border-radius:20px;border-bottom:none!important;}
.tag{font-size:11px;color:#555;border:.5px solid #bbb;padding:3px 10px;border-radius:20px;}
.tag.genre{border-color:#2D3561;color:#2D3561;}
.pill{font-size:11px;color:#aaa;border:.5px solid #ddd;padding:3px 10px;border-radius:20px;}
.back{font-size:11px;color:#aaa;text-decoration:none;letter-spacing:.04em;text-transform:uppercase;display:inline-block;margin:24px 0 0;}
.back:hover{color:#111;}
.work-header{padding:20px 0 24px;border-bottom:1px solid #111;}
.work-type{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:8px;}
.work-title{font-family:'EB Garamond',serif;font-size:36px;font-weight:700;line-height:1.1;color:#111;margin-bottom:16px;}
.work-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.work-meta{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.work-description{font-family:'EB Garamond',serif;font-size:15px;color:#555;line-height:1.7;margin-bottom:10px;font-style:italic;}
.work-author-note{font-size:12px;color:#888;line-height:1.6;padding:12px 16px;border-left:2px solid #ddd;margin-bottom:0;}
.likes-btn{cursor:pointer;background:none;border:.5px solid #ddd;padding:3px 10px;border-radius:20px;font-size:11px;color:#aaa;font-family:'Inter',sans-serif;}
.likes-btn:hover{color:#111;border-color:#aaa;}
.work-body{padding:32px 0;border-bottom:1px solid #ddd;line-height:1.85;font-size:17px;color:#222;font-family:'EB Garamond',serif;}
.work-body p{margin-bottom:1.2em;}
.comments-section{padding:28px 0;}
.comments-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#111;font-weight:500;margin-bottom:20px;}
.comment-form textarea{width:100%;border:.5px solid #ddd;padding:12px;font-family:'Inter',sans-serif;font-size:13px;color:#111;resize:none;height:80px;outline:none;}
.comment-form textarea:focus{border-color:#111;}
.comment-form-row{display:flex;gap:10px;margin-bottom:10px;}
.comment-form-row input{flex:1;border:.5px solid #ddd;padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;color:#111;outline:none;}
.comment-form-row input:focus{border-color:#111;}
.comment-form-footer{display:flex;justify-content:flex-end;margin-top:8px;}
.comment-submit{font-size:11px;color:#111;border:.5px solid #111;padding:6px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;background:#fff;border-radius:20px;}
.comment-submit:hover{background:#111;color:#fff;}
.comment{padding:14px 0;border-bottom:.5px solid #eee;}
.comment:last-child{border-bottom:none;}
.comment-author{font-size:12px;font-weight:500;color:#111;margin-bottom:4px;}
.comment-date{font-size:11px;color:#aaa;margin-left:8px;font-weight:400;}
.comment-text{font-size:13px;color:#444;line-height:1.6;}
.loading{font-size:13px;color:#aaa;padding:20px 0;}

.subscribe-strip{border-top:1px solid #ddd;padding:24px 0;margin-top:32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.subscribe-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aaa;flex-shrink:0;}
.subscribe-text{font-size:13px;color:#555;flex-shrink:0;}
.subscribe-form{display:flex;gap:8px;flex:1;min-width:240px;}
.subscribe-input{flex:1;border:.5px solid #ddd;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;color:#111;outline:none;min-width:0;}
.subscribe-input:focus{border-color:#111;}
.subscribe-btn{font-size:11px;color:#fff;background:#111;border:none;padding:8px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;white-space:nowrap;}
.subscribe-btn:hover{{background:#333;}}
.footer{padding:20px 0;border-top:1px solid #ddd;margin-top:32px;text-align:center;}
.footer-copy{font-size:11px;color:#999;letter-spacing:.04em;}
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><a href="index.html"><img src="logo.jpg" alt="Raft & Draft" /></a></div>
  <div class="nav-links">
    <a href="library.html">Библиотека</a>
    <a href="guidelines.html">Гайдлайны</a>
    <a href="about.html">О журнале</a>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdKL0W-uNZ7PUDgZoWYnVMaARBgQnxY4mrbmILQDD5bpYpnFw/viewform" target="_blank" class="nav-submit">Подать работу</a>
  </div>
</nav>
<div class="site">
  <a href="library.html" class="back">← Библиотека</a>
  <div id="work-content"><div class="loading" style="margin-top:24px;">Загрузка...</div></div>
  
  <div class="subscribe-strip">
    <div class="subscribe-label">Рассылка</div>
    <div class="subscribe-text">Новые работы — сразу на почту.</div>
    <form action="https://raft-and-draft.us2.list-manage.com/subscribe/post?u=214012e6e7b78ed0c2fc0a140&id=7ea7b3c929&f_id=0046c2e1f0" method="post" target="_blank" class="subscribe-form">
      <input type="email" name="EMAIL" placeholder="your@email.com" required class="subscribe-input" />
      <div aria-hidden="true" style="position:absolute;left:-5000px;"><input type="text" name="b_214012e6e7b78ed0c2fc0a140_7ea7b3c929" tabindex="-1" value=""></div>
      <button type="submit" class="subscribe-btn">Подписаться</button>
    </form>
  </div>
  <div class="footer"><div class="footer-copy">© 2026 Raft & Draft. Все права защищены.</div></div>
</div>
<script>
const SUPABASE_URL = 'https://jklglpxcspykidibuyra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_q2fsDKFZ_RATNkQ96JuqlQ_XWQTIv0g';
const id = new URLSearchParams(location.search).get('id');

async function api(path) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
  }).then(r => r.json());
}

async function like(current, btn) {
  const n = current + 1;
  await fetch(SUPABASE_URL + '/rest/v1/works?id=eq.' + id, {
    method:'PATCH',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({likes:n})
  });
  btn.textContent = '♡ ' + n;
  btn.dataset.likes = n;
}

async function submitComment() {
  const name = document.getElementById('c-name').value.trim();
  const text = document.getElementById('c-text').value.trim();
  if (!name || !text) return;
  await fetch(SUPABASE_URL + '/rest/v1/comments', {
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({work_id:id, author:name, text})
  });
  document.getElementById('c-name').value = '';
  document.getElementById('c-text').value = '';
  loadComments();
}

async function loadComments() {
  const comments = await api('comments?work_id=eq.' + id + '&order=created_at.asc');
  const el = document.getElementById('comments-list');
  if (!el) return;
  document.getElementById('comments-title').textContent = 'Комментарии · ' + comments.length;
  el.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="comment-author">${c.author} <span class="comment-date">${new Date(c.created_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</span></div>
      <div class="comment-text">${c.text}</div>
    </div>
  `).join('') || '';
}

async function load() {
  if (!id) { document.getElementById('work-content').innerHTML = '<div class="loading">Работа не найдена.</div>'; return; }
  const works = await api('works?id=eq.' + id);
  const w = works[0];
  if (!w) { document.getElementById('work-content').innerHTML = '<div class="loading">Работа не найдена.</div>'; return; }
  document.title = w.title + ' — Raft & Draft';
  document.getElementById('work-content').innerHTML = `
    <div class="work-header">
      <div class="work-type">${w.type}</div>
      <div class="work-title">${w.title}</div>
      <div class="work-tags">
        <span class="tag">${w.author}</span>
        ${w.city ? '<span class="tag">' + w.city + '</span>' : ''}
        <span class="tag genre">${w.genre}</span>
      </div>
      <div class="work-meta">
        <span class="pill">${new Date(w.created_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</span>
        <button class="likes-btn" data-likes="${w.likes}" onclick="like(parseInt(this.dataset.likes),this)">♡ ${w.likes}</button>
      </div>
      ${w.description ? '<div class="work-description">' + w.description + '</div>' : ''}
      ${w.author_note ? '<div class="work-author-note">' + w.author_note + '</div>' : ''}
    </div>
    <div class="work-body">${w.content.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('')}</div>
    <div class="comments-section">
      <div class="comments-title" id="comments-title">Комментарии</div>
      <div class="comment-form">
        <div class="comment-form-row"><input id="c-name" placeholder="Ваше имя" /></div>
        <textarea id="c-text" placeholder="Напишите комментарий..."></textarea>
        <div class="comment-form-footer"><button class="comment-submit" onclick="submitComment()">Отправить</button></div>
      </div>
      <div id="comments-list"></div>
    </div>
  `;
  loadComments();
}
load();
</script>
</body>
</html>
